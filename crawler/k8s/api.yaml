apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-api
  namespace: crawler
spec:
  replicas: 2
  selector:
    matchLabels: { app: crawler-api }
  template:
    metadata:
      labels: { app: crawler-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/ecommarketdata-crawler:latest
          command: ["node", "services/api/index.js"]
          ports: [{ containerPort: 8300 }]
          envFrom:
            - configMapRef: { name: crawler-config }
            - secretRef: { name: crawler-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8300 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-api
  namespace: crawler
spec:
  selector: { app: crawler-api }
  ports: [{ port: 80, targetPort: 8300 }]
