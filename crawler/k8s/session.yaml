apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-session
  namespace: crawler
spec:
  replicas: 2
  selector:
    matchLabels: { app: crawler-session }
  template:
    metadata:
      labels: { app: crawler-session }
    spec:
      containers:
        - name: session
          image: ghcr.io/OWNER/ecommarketdata-crawler:latest
          command: ["node", "services/session/index.js"]
          ports: [{ containerPort: 8301 }]
          envFrom:
            - configMapRef: { name: crawler-config }
            - secretRef: { name: crawler-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: session
  namespace: crawler
spec:
  selector: { app: crawler-session }
  ports: [{ port: 8301, targetPort: 8301 }]
