apiVersion: v1
kind: ConfigMap
metadata:
  name: crawler-config
  namespace: crawler
data:
  KAFKA_BROKERS: redpanda:9092
  TOPIC_JOBS: crawl.jobs
  CONSUMER_GROUP: crawl-workers
  BATCH_SIZE: "50"
  CONCURRENCY: "32"
  RATE_PER_SECOND: "120"
  SHARD_SIZE: "5000"
  CLICKHOUSE_URL: http://clickhouse:8123
  SESSION_URL: http://session:8301
  SHOPEE_BASE: https://shopee.vn
